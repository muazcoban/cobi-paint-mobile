name: cobi_paint_mobile
description: "Cobi Paint - Çocuklar için eğlenceli boyama uygulaması"
publish_to: 'none'

version: 2.0.0+4

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  image: ^4.7.2
  uuid: ^4.5.2
  audioplayers: ^6.1.0
  in_app_purchase: ^3.3.1
  in_app_purchase_platform_interface: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FF6B6B"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/tools/
    - assets/stickers/
    - assets/images/categories/
    - assets/images/categories/animals/
    - assets/images/categories/plants/
    - assets/images/categories/vehicles/
    - assets/images/categories/characters/
    - assets/images/categories/nature/
    - assets/images/categories/food/
    - assets/pages/animals/
    - assets/pages/plants/
    - assets/pages/food/
    - assets/pages/vehicles/
    - assets/pages/nature/
    - assets/pages/things/
    - assets/pages/free/
    - assets/licenses/
    - assets/sounds/
